<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 40%, #e8eaf6 70%, #e3f2fd 100%);
  position: relative;
}
.bg-circle { position:absolute; border-radius:50%; opacity:0.25; }
.bc1 { width:500px; height:500px; background:radial-gradient(#f48fb1,#ce93d8); top:-150px; left:-100px; }
.bc2 { width:400px; height:400px; background:radial-gradient(#ce93d8,#9fa8da); bottom:-120px; right:-80px; }
.gloss { position:absolute; top:0; left:0; right:0; height:200px; background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,transparent 100%); }
.content { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:60px; }
.deco-top { font-size:28px; letter-spacing:12px; margin-bottom:20px; opacity:0.8; }
.logo-beauty { font-family:'Dancing Script',cursive; font-size:96px; font-weight:700; background:linear-gradient(135deg,#e91e8c,#9c27b0,#673ab7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; margin-bottom:4px; }
.logo-routine { font-size:32px; font-weight:700; letter-spacing:14px; color:#7b1fa2; text-transform:uppercase; margin-bottom:6px; }
.logo-app { font-size:16px; font-weight:600; letter-spacing:6px; color:#ab47bc; text-transform:uppercase; margin-bottom:30px; }
.divider { width:120px; height:3px; background:linear-gradient(90deg,transparent,#e91e8c,#9c27b0,transparent); border-radius:2px; margin-bottom:28px; }
.tagline { font-size:26px; font-weight:500; color:#6a1b9a; margin-bottom:10px; line-height:1.4; }
.tagline strong { color:#e91e8c; font-weight:700; }
.pills { display:flex; gap:14px; margin:22px 0 28px; flex-wrap:wrap; justify-content:center; }
.pill { background:rgba(255,255,255,0.75); border:1.5px solid rgba(233,30,140,0.2); border-radius:50px; padding:8px 20px; font-size:15px; color:#7b1fa2; font-weight:500; }
.url-badge { background:linear-gradient(135deg,#e91e8c,#9c27b0); color:white; font-size:20px; font-weight:700; padding:14px 40px; border-radius:50px; letter-spacing:1px; box-shadow:0 8px 28px rgba(233,30,140,0.35); }
.star { position:absolute; font-size:22px; opacity:0.4; }
.s1 { top:60px; left:80px; } .s2 { top:40px; right:120px; font-size:16px; opacity:0.3; }
.s3 { bottom:80px; left:120px; font-size:18px; opacity:0.35; } .s4 { top:160px; left:200px; font-size:14px; opacity:0.25; }
.s5 { bottom:120px; right:200px; font-size:20px; opacity:0.3; } .s6 { top:80px; left:500px; font-size:12px; opacity:0.25; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-circle bc1"></div>
<div class="bg-circle bc2"></div>
<div class="gloss"></div>
<div class="star s1">✨</div><div class="star s2">⭐</div>
<div class="star s3">💫</div><div class="star s4">✨</div>
<div class="star s5">🌸</div><div class="star s6">💕</div>
<div class="content">
  <div class="deco-top">🌸 ✨ 🌸</div>
  <div class="logo-beauty">Beauty</div>
  <div class="logo-routine">Routine</div>
  <div class="logo-app">App</div>
  <div class="divider"></div>
  <div class="tagline">Deine tägliche Skincare-Routine.<br><strong>Kostenlos. Ohne Anmeldung.</strong></div>
  <div class="pills">
    <div class="pill">🌅 Morgenroutine</div>
    <div class="pill">🌙 Abendroutine</div>
    <div class="pill">📅 Termine</div>
    <div class="pill">💡 Beauty-Tipps</div>
  </div>
  <div class="url-badge">beautyroutine.app</div>
</div>
</body>
</html>
